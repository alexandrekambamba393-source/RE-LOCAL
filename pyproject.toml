[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rea-local"
version = "0.2.0"
description = "Local reverse-engineering helper with a CLI and MCP server. Static evidence, cited reports, local history."
requires-python = ">=3.10"
dependencies = []

[project.scripts]
rea = "rea.cli:main"

[tool.setuptools]
packages = ["rea"]
